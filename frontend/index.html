<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/icon-dark.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/icon-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Raster fallback for Safari, which doesn't reliably render SVG favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- Add to Home Screen: installed icon, name and full-screen launch (iOS reads the
         apple-* tags, others the manifest). The title bar pads for the status bar;
         light themes switch it to "default" in the theme script below. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agentrove" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="light dark" />
    <title>Agentrove</title>
  </head>
  <body>
    <script>
      (function initTheme() {
        // Mirrors App.tsx's theme effect so the first paint already matches. The store is
        // zustand-persisted under 'ui-storage' as { state: { theme, ... }, version }.
        // Custom palettes: { [name]: [base, surface] }, inlined by vite.config.ts.
        const palettes = /* palette-boot */ {};
        try {
          const persisted = localStorage.getItem('ui-storage');
          const stored = persisted ? JSON.parse(persisted)?.state?.theme : undefined;
          const theme = typeof stored === 'string' ? stored : 'dark';
          const palette = Object.prototype.hasOwnProperty.call(palettes, theme)
            ? palettes[theme]
            : null;
          let resolved = theme === 'light' ? 'light' : 'dark';
          if (palette) {
            resolved = palette[0];
          } else if (theme === 'system') {
            resolved =
              window.matchMedia?.('(prefers-color-scheme: dark)')?.matches === false
                ? 'light'
                : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-palette', theme);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              palette ? palette[1] : resolved === 'dark' ? '#0a0a0b' : '#ffffff',
            );
          }
          // Installed on iOS: white status-bar text over a light title bar would vanish.
          const statusBar = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          );
          if (statusBar && resolved === 'light') statusBar.setAttribute('content', 'default');
        } catch (error) {
          console.warn('Theme init failed', error);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
