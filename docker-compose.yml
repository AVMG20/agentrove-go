name: agentrove

# Single-host setup: one Go container serves the API and the built frontend
# (for hot reload, run the Vite dev server against it, see README.md).
# Workspaces run in per-workspace sandbox containers created through the
# Docker socket; idle ones are stopped after SANDBOX_IDLE_TTL_SECONDS and
# restarted on demand. No Redis needed.
services:
  api:
    build:
      context: .
    restart: unless-stopped
    user: root
    ports:
      - "${APP_PORT:-${BACKEND_PORT:-8080}}:8080"
    volumes:
      # Sandbox bind mounts are resolved by the host daemon, so the API must
      # know the host-side path of its storage dir (HOST_STORAGE_PATH).
      - ${HOST_STORAGE_PATH:-./storage}:/data/agentrove/storage
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      STORAGE_PATH: /data/agentrove/storage
      DOCKER_NETWORK: ${DOCKER_NETWORK:-agentrove-sandbox-net}
      # How sandbox agents reach the API's MCP endpoint over the sandbox network.
      AGENTROVE_INTERNAL_URL: ${AGENTROVE_INTERNAL_URL:-http://api:8080}
      # Links in emails and artifact URLs point at the app itself.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${APP_PORT:-${BACKEND_PORT:-8080}}}
    networks:
      - default
      - sandbox

networks:
  # Shared box network; per-user box networks are created at runtime and
  # firewalled by the API (SANDBOX_EGRESS_FIREWALL, deploy/README.md).
  sandbox:
    name: ${DOCKER_NETWORK:-agentrove-sandbox-net}
