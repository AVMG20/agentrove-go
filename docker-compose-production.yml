name: agentrove

# Production stack (e.g. Coolify): the Go API also serves the built frontend.
# Point the domain at the "api" service, port 8080.
services:
  # Builds the sandbox image on the host so the API can start workspace
  # containers from it; exits immediately.
  sandbox-image:
    build:
      context: .
      dockerfile: sandbox/docker/Dockerfile
      args:
        # Optional: a download URL of the Antigravity CLI (agy) to install.
        AGY_URL: ${AGY_URL:-}
    image: ${DOCKER_IMAGE:-agentrove-sandbox:latest}
    command: ["true"]
    restart: "no"
    # Coolify: a one-shot container shouldn't count toward app health.
    exclude_from_hc: true

  api:
    build:
      context: .
    restart: unless-stopped
    user: root
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    volumes:
      # Same path on host and in the container: sandbox bind mounts are
      # resolved by the host's Docker daemon.
      - ${AGENTROVE_STORAGE_SOURCE:-/data/agentrove-go/storage}:/data/agentrove/storage
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ENVIRONMENT: production
      # Not required here: Coolify interpolates the file at build time without
      # runtime secrets. The API refuses to start unless it's 32+ characters.
      SECRET_KEY: ${SECRET_KEY:-}
      STORAGE_PATH: /data/agentrove/storage
      HOST_STORAGE_PATH: ${AGENTROVE_STORAGE_SOURCE:-/data/agentrove-go/storage}
      DOCKER_IMAGE: ${DOCKER_IMAGE:-agentrove-sandbox:latest}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-agentrove-sandbox-net}
      # How sandbox agents reach the API's MCP endpoint over the sandbox network.
      AGENTROVE_INTERNAL_URL: ${AGENTROVE_INTERNAL_URL:-http://api:8080}
      # Host firewall for boxes (deploy/README.md): on | off | dry-run.
      SANDBOX_EGRESS_FIREWALL: ${SANDBOX_EGRESS_FIREWALL:-on}
      SANDBOX_EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-}
      SANDBOX_EGRESS_DNS: ${SANDBOX_EGRESS_DNS:-}
      SANDBOX_EGRESS_HAIRPIN_PORTS: ${SANDBOX_EGRESS_HAIRPIN_PORTS:-}
      SANDBOX_IDLE_TTL_SECONDS: ${SANDBOX_IDLE_TTL_SECONDS:-900}
      # Box browser for agents and the Browser tab (backend/CONVENTIONS.md).
      SANDBOX_BROWSER_ENABLED: ${SANDBOX_BROWSER_ENABLED:-true}
      SANDBOX_BROWSER_IDLE_SECONDS: ${SANDBOX_BROWSER_IDLE_SECONDS:-600}
      ALLOWED_ORIGINS: ${APP_URL:-http://localhost}
      BASE_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${APP_URL:-http://localhost}
      REGISTRATION_DISABLED: ${REGISTRATION_DISABLED:-false}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      AGENT_ENV: ${AGENT_ENV:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - sandbox

networks:
  # Shared box network (fallback when per-user networks are off). Boxes
  # normally get their own agentrove-user-net-<id> bridges, created at
  # runtime; the egress firewall covers both. Don't add driver_opts here:
  # changing an existing network's options makes compose recreate it.
  sandbox:
    name: ${DOCKER_NETWORK:-agentrove-sandbox-net}
